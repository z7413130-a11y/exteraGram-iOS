name: exteraGram iOS Port 0.0.5 - Device archive for later signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-device-build
  cancel-in-progress: false

jobs:
  iphone-archive:
    if: github.event.repository.private == false && github.ref == 'refs/heads/master'
    runs-on: xcode-27
    timeout-minutes: 330
    env:
      PORT_VERSION: '0.0.5'
      PORT_BUILD_NUMBER: '5'
      IOS_BUNDLE_ID: 'org.exteragram.iosport'
    steps:
      - name: Check out pinned source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify Xcode and install checked Bazel 9.2.0
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          sw_vers
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.1'
          xcrun --sdk iphoneos --show-sdk-version
          sysctl hw.ncpu hw.memsize
          df -h "$GITHUB_WORKSPACE"
          read -r bazel_version bazel_sha <<< "$(python3 -c 'import json; print(*json.load(open("versions.json"))["bazel"].split(":"))')"
          test "$bazel_version" = '9.2.0'
          bazel_bin="$RUNNER_TEMP/bazel-$bazel_version-darwin-arm64"
          curl --fail --location --retry 3 --output "$bazel_bin" "https://github.com/bazelbuild/bazel/releases/download/$bazel_version/bazel-$bazel_version-darwin-arm64"
          printf '%s  %s\n' "$bazel_sha" "$bazel_bin" | shasum -a 256 -c -
          chmod +x "$bazel_bin"
          test "$("$bazel_bin" --version)" = "bazel $bazel_version"
          echo "BAZEL_BIN=$bazel_bin" >> "$GITHUB_ENV"

      - name: Load pinned submodules recursively
        id: submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule init
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule update --init --recursive --depth 1 --jobs 2
          git submodule status --recursive
          if git submodule status --recursive | grep -E '^[-+U]'; then exit 1; fi
          fingerprint=$(git submodule status --recursive | awk '{print $1, $2}' | shasum -a 256 | awk '{print $1}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          df -h "$GITHUB_WORKSPACE"

      - name: Restore Bazel checksummed public downloads
        id: bazel-downloads
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/bazel-repository-cache/content_addressable/sha256
          key: bazel-downloads-v1-${{ runner.os }}-${{ runner.arch }}-bazel-9.2.0-xcode-27.1-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock', 'WORKSPACE', '.gitmodules', 'build-system/bazel-patches/**') }}-${{ steps.submodules.outputs.fingerprint }}

      - name: Prepare pinned iOS bundling rules for deferred signing
        shell: bash
        run: |
          set -euo pipefail
          rules=build-system/bazel-rules/rules_apple
          test "$(git -C "$rules" rev-parse HEAD)" = '485016eb5b0948cc17307064e7977a6d68e94046'
          grep -q 'disable_legacy_signing' "$rules/apple/internal/codesigning_support.bzl"
          python3 - "$rules/apple/internal/ios_rules.bzl" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          rules = path.read_text().split('\ndef ')
          guard = '    if platform_prerequisites.platform.is_device:'
          anchor = guard + '\n        processor_partials.append(\n            partials.provisioning_profile_partial('
          replacement = ('    # Embed a profile when provided, or let normal device signing require one.\n'
                         '    if platform_prerequisites.platform.is_device and (\n'
                         '        provisioning_profile or "disable_legacy_signing" not in features\n'
                         '    ):')
          for name in ('_ios_application_impl', '_ios_extension_impl'):
              matches = [index for index, rule in enumerate(rules) if rule.startswith(name + '(ctx):\n')]
              if len(matches) != 1 or rules[matches[0]].count(anchor) != 1:
                  sys.exit(f'Unexpected provisioning-profile logic in pinned rules_apple: {name}')
              index = matches[0]
              rules[index] = rules[index].replace(anchor, replacement + anchor[len(guard):], 1)
          path.write_text('\ndef '.join(rules))
          PY

      - name: Configure device archive and resource limits using public placeholders
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 build-system/Make/SideloadSiri.py check-source
          python3 build-system/Make/SideloadSiri.py prepare-localizations Telegram/Telegram-iOS
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('build-system/template_minimal_development_configuration.json').read_text())
          # No real signing team is assigned at compilation time; the installed app requires valid signing.
          config.update(bundle_id=os.environ['IOS_BUNDLE_ID'], team_id='0000000000',
                        api_id='1', api_hash='0' * 32, is_internal_build='false',
                        is_appstore_build='false', enable_siri=False, enable_icloud=False)
          Path(os.environ['RUNNER_TEMP'], 'device-configuration.json').write_text(json.dumps(config))
          path = Path('versions.json')
          versions = json.loads(path.read_text())
          versions['app'] = os.environ['PORT_VERSION']
          path.write_text(json.dumps(versions, indent=4) + '\n')
          PY
          cat >> "$HOME/.bazelrc" <<'EOF'
          startup --host_jvm_args=-Xmx3g
          build --jobs=2
          build --loading_phase_threads=2
          build --local_resources=cpu=2
          build --local_resources=memory=3500
          build --worker_max_instances=1
          build --worker_max_multiplex_instances=1
          build --discard_analysis_cache
          build --//Telegram:disableProvisioningProfiles=true
          build --features=disable_legacy_signing
          build --apple_generate_dsym
          build --output_groups=+dossier,+dsyms
          build --curses=no
          build --color=no
          EOF
          printf 'build --repository_cache=%s\n' "$RUNNER_TEMP/bazel-repository-cache" >> "$HOME/.bazelrc"
          echo 'The device archive uses the network and local authorization paths without iCloud.'

      - name: Prepare redacted Bazel build driver
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/device-build.py" <<'PY'
          import base64, json, os, re, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          path = root / 'device-configuration.json'
          config = json.loads(path.read_text())
          if config.get('enable_siri') is not False:
              sys.exit('The deferred-signing build must leave Siri authorization disabled.')
          mode = sys.argv[1]
          if mode not in ('analysis', 'warm', 'build'):
              sys.exit('Expected analysis, warm or build mode.')
          masks = set()
          if mode == 'build':
              for value in (config['api_id'], config['api_hash']):
                  masks.update((value, value.upper(), value.lower(), base64.b64encode(value.encode()).decode()))
          elif config['api_id'] != '1' or config['api_hash'] != '0' * 32:
              sys.exit('Public stages require the fixed placeholder credentials.')
          cmd = ['python3', '-u', 'build-system/Make/Make.py', '--bazel', os.environ['BAZEL_BIN']]
          if mode == 'warm':
              cmd += ['--cacheDir', str(root / 'public-webrtc-action-cache')]
          cmd += ['build', '--configurationPath', str(path), '--xcodeManagedCodesigning',
                  '--buildNumber', os.environ['PORT_BUILD_NUMBER'], '--configuration', 'debug_arm64']
          if mode == 'warm':
              cmd += ['--target', '//Telegram:webrtc_build_test']
          rc = Path.home() / '.bazelrc'
          previous_rc = rc.read_bytes()
          try:
              if mode == 'analysis':
                  rc.write_bytes(previous_rc + b'\nbuild --nobuild\nbuild --keep_going\n')
              proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors='replace')
              for line in proc.stdout:
                  if re.search(r'(?i)\b(?:telegram_|app_config_)?api_?(?:id|hash)\b', line):
                      print('[configuration-related line redacted]', flush=True)
                      continue
                  for value in sorted(masks, key=len, reverse=True):
                      line = line.replace(value, '[redacted]')
                  line = re.sub(r'(?i)\b[0-9a-f]{32}\b', '[redacted-hex]', line)
                  print(line, end='', flush=True)
              status = proc.wait()
          finally:
              if mode == 'analysis':
                  rc.write_bytes(previous_rc)
          sys.exit(status)
          PY

      - name: Analyze complete ARM64 iPhone target (no compilation)
        shell: bash
        run: python3 -u "$RUNNER_TEMP/device-build.py" analysis

      - name: Check public download cache size
        id: bazel-download-budget
        if: steps.bazel-downloads.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/bazel-repository-cache/content_addressable/sha256"
          if [[ -d "$cache" ]]; then
            size_kib=$(du -sk "$cache" | cut -f1)
            echo "Bazel public download cache: ${size_kib} KiB"
            if (( size_kib <= 3 * 1024 * 1024 )); then
              echo 'save=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Save only checksummed public downloads
        if: steps.bazel-download-budget.outputs.save == 'true' && steps.bazel-downloads.outputs.cache-primary-key != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/bazel-repository-cache/content_addressable/sha256
          key: ${{ steps.bazel-downloads.outputs.cache-primary-key }}

      - name: Compute the WebRTC compilation cache key
        id: webrtc-cache-key
        shell: bash
        run: |
          set -euo pipefail
          tree=$(git rev-parse HEAD:third-party)
          build=$(xcodebuild -version | awk '/Build version/ {print $3}')
          test -n "$build"
          echo "key=webrtc-ios-arm64-bazel-9.2.0-xcode-${build}-v1-${tree}-${{ steps.submodules.outputs.fingerprint }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'WORKSPACE', 'build-system/bazel-patches/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore public WebRTC compilation outputs
        id: webrtc-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/public-webrtc-action-cache
          key: ${{ steps.webrtc-cache-key.outputs.key }}

      - name: Prepare WebRTC compilation outputs with no real API data
        id: webrtc-warm
        continue-on-error: true
        shell: bash
        run: python3 -u "$RUNNER_TEMP/device-build.py" warm

      - name: Check the public WebRTC cache budget
        id: webrtc-cache-budget
        if: steps.webrtc-warm.outcome == 'success' && steps.webrtc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/public-webrtc-action-cache"
          if [[ -d "$cache" ]]; then
            size_kib=$(du -sk "$cache" | cut -f1)
            echo "Public WebRTC compilation cache: ${size_kib} KiB"
            if (( size_kib > 0 && size_kib <= 3 * 1024 * 1024 )); then
              echo 'save=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Save public WebRTC compilation outputs before injecting secrets
        if: steps.webrtc-cache-budget.outputs.save == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/public-webrtc-action-cache
          key: ${{ steps.webrtc-cache-key.outputs.key }}

      - name: Remove the temporary CI cache and configure API credentials
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          umask 077
          rm -rf "$RUNNER_TEMP/public-webrtc-action-cache"
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          api_id = os.environ.get('TELEGRAM_API_ID', '')
          api_hash = os.environ.get('TELEGRAM_API_HASH', '')
          if not re.fullmatch(r'[1-9][0-9]*', api_id) or not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              sys.exit('Telegram API credentials are missing or malformed.')
          path = Path(os.environ['RUNNER_TEMP'], 'device-configuration.json')
          config = json.loads(path.read_text())
          config.update(api_id=api_id, api_hash=api_hash)
          path.write_text(json.dumps(config))
          PY

      - name: Compile complete ARM64 iPhone target for subsequent standard signing
        shell: bash
        run: python3 -u "$RUNNER_TEMP/device-build.py" build

      - name: Audit actual IPA structure, extensions, platform and minimum iOS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ipa=bazel-bin/Telegram/Telegram.ipa
          test -s "$ipa"
          stage="$RUNNER_TEMP/device-audit"
          mkdir -p "$stage"
          ditto -x -k "$ipa" "$stage"
          python3 build-system/Make/SideloadSiri.py audit-app "$stage"/Payload/*.app
          python3 - <<'PY'
          import json, os, plistlib, re, subprocess, sys
          from pathlib import Path
          stage = Path(os.environ['RUNNER_TEMP'], 'device-audit')
          base = os.environ['IOS_BUNDLE_ID']
          apps = list((stage / 'Payload').glob('*.app'))
          if len(apps) != 1:
              sys.exit('IPA must contain exactly one main application.')
          app = apps[0]
          bundles = [app] + sorted((app / 'PlugIns').glob('*.appex'))
          wanted = {base + '.' + item for item in ('Share','NotificationContent','NotificationService','SiriIntents','Widget','BroadcastUpload')}
          found = set()
          records = []
          def read_plist(path):
              with path.open('rb') as f: return plistlib.load(f)
          def version_tuple(value):
              parts = tuple(int(x) for x in value.split('.'))
              return (parts + (0, 0, 0))[:3]
          for bundle in bundles:
              info = read_plist(bundle / 'Info.plist')
              identifier = info['CFBundleIdentifier']
              if bundle == app:
                  if identifier != base or info['CFBundleShortVersionString'] != os.environ['PORT_VERSION'] or info['CFBundleVersion'] != os.environ['PORT_BUILD_NUMBER']:
                      sys.exit('Unexpected main bundle ID, version or build number')
                  if 'TelegramCloudKitContainer' in info:
                      sys.exit('Unexpected CloudKit opt-in in the deferred-signing IPA')
              else:
                  if not info.get('NSExtension', {}).get('NSExtensionPointIdentifier'):
                      sys.exit('An extension has no extension point identifier')
                  found.add(identifier)
              executable = bundle / info['CFBundleExecutable']
              if not executable.is_file(): sys.exit('Missing bundle executable')
              records.append({'id': identifier, 'file': str(executable.relative_to(app)), 'minimum_ios': info.get('MinimumOSVersion'), 'extension_point': info.get('NSExtension', {}).get('NSExtensionPointIdentifier')})
          if found != wanted or len(bundles) != len(wanted) + 1:
              sys.exit(f'Unexpected extension inventory: missing={sorted(wanted - found)}, extra={sorted(found - wanted)}')
          if any(app.rglob('embedded.mobileprovision')):
              sys.exit('Unexpected embedded provisioning profile in deferred-signing archive')
          magic = {b'\xcf\xfa\xed\xfe',b'\xfe\xed\xfa\xcf',b'\xce\xfa\xed\xfe',b'\xfe\xed\xfa\xce',b'\xca\xfe\xba\xbe',b'\xbe\xba\xfe\xca',b'\xca\xfe\xba\xbf',b'\xbf\xba\xfe\xca'}
          binaries = []
          minimums = [r['minimum_ios'] for r in records if r['minimum_ios']]
          for path in sorted(app.rglob('*')):
              if not path.is_file() or path.is_symlink(): continue
              with path.open('rb') as f:
                  if f.read(4) not in magic: continue
              archs = subprocess.check_output(['xcrun','lipo','-archs',str(path)], text=True).strip().split()
              if 'arm64' not in archs or set(archs) - {'arm64','arm64e'}:
                  sys.exit('Unexpected Mach-O architecture in ' + str(path.relative_to(app)))
              build = subprocess.check_output(['xcrun','vtool','-show-build',str(path)], text=True)
              platforms = re.findall(r'(?m)^\s*platform\s+(\S+)', build)
              min_versions = re.findall(r'(?m)^\s*minos\s+(\d+(?:\.\d+)+)', build)
              if not platforms and 'LC_VERSION_MIN_IPHONEOS' in build:
                  platforms = ['IOS']
                  min_versions = re.findall(r'(?m)^\s*version\s+(\d+(?:\.\d+)+)', build)
              if not platforms or any(p not in ('IOS','2') for p in platforms):
                  sys.exit('Non-device iOS Mach-O (or missing platform): ' + str(path.relative_to(app)))
              if not min_versions:
                  sys.exit('Missing Mach-O minimum OS metadata: ' + str(path.relative_to(app)))
              minimums.extend(min_versions)
              binaries.append({'path':str(path.relative_to(app)), 'architectures':archs,'platforms':platforms,'minimum_ios':min_versions})
          if not binaries or not all(any(x['path']==r['file'] for x in binaries) for r in records):
              sys.exit('Not all application and extension executable binaries were audited')
          framework_paths = sorted(p for p in app.rglob('*.framework') if p.is_dir())
          frameworks = [str(p.relative_to(app)) for p in framework_paths]
          framework_ids = {read_plist(p / 'Info.plist').get('CFBundleIdentifier') for p in framework_paths if (p / 'Info.plist').is_file()}
          expected_frameworks = {base + '.' + item for item in ('MtProtoKit','SwiftSignalKit','Postbox','TelegramCore','TelegramUI')}
          if not expected_frameworks <= framework_ids:
              sys.exit('Missing required core frameworks: ' + ', '.join(sorted(expected_frameworks - framework_ids)))
          effective_min = max(minimums, key=version_tuple)
          report = {'port_version':os.environ['PORT_VERSION'],'build_number':os.environ['PORT_BUILD_NUMBER'],'bundle_id':base,'archive_kind':'uninstalled device archive; standard signing required',
                    'main_and_extensions':records,'extensions_count':len(bundles)-1,'frameworks':frameworks,'mach_o_count':len(binaries),'mach_o':binaries,
                    'maximum_declared_minos_across_bundled_binaries':effective_min,'ios_15_metadata_compatible':version_tuple(effective_min) <= (15,0,0),
                    'profile_embedded':False,'runtime_tested':False,
                    'capabilities_note':'App Groups, shared Keychain and APNs require valid signed entitlements and matching profiles; user denial and extension IPC require on-device tests.',
                    'source_audit':{'app_group_startup_guard_present': 'guard let appGroupUrl = maybeAppGroupUrl' in Path('submodules/TelegramUI/Sources/AppDelegate.swift').read_text(),
                                    'apns_failure_handler_present': 'didFailToRegisterForRemoteNotificationsWithError' in Path('submodules/TelegramUI/Sources/AppDelegate.swift').read_text()}}
          output = Path(os.environ['RUNNER_TEMP'], 'ipa-report.json')
          output.write_text(json.dumps(report, indent=2) + '\n')
          print('Device archive: all six original extension identifiers present:', len(found))
          print('Audited Mach-O files:', len(binaries), '; bundled frameworks:', len(frameworks))
          print('Highest recorded minimum iOS version:', effective_min, '; physical runtime not tested.')
          PY

      - name: Encrypt IPA for private testing (public repository)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # This is a public file-encryption certificate, NOT an Apple signing certificate.
          cat > "$RUNNER_TEMP/artifact-recipient.pem" <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIID2jCCAkICCQCqOBRCSNDYPzANBgkqhkiG9w0BAQsFADAvMS0wKwYDVQQDDCRl
          eHRlcmFHcmFtIGxvY2FsIGFydGlmYWN0IGRlY3J5cHRpb24wHhcNMjYxMTI1MTg1
          NjU3WhcNMzYxMTIyMTg1NjU3WjAvMS0wKwYDVQQDDCRleHRlcmFHcmFtIGxvY2Fs
          IGFydGlmYWN0IGRlY3J5cHRpb24wggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK
          AoIBgQCvITArMaZ4160oBHJR/UqqRCvcy7yYCMsvBne+YgzHZ8wzmlXz0V4NlKuk
          VsfO9TwmdzP5pypabHmYplls6ao1qLgsDo3g6+JGqL+FaMsoqNN9l/VXXOnMsZmF
          hMMbXrplOdcP0efMkTp+y3aiKnEbVhNSZ4MkjIbuPZfPcFGC+wPllSKcaEaFu1xR
          YIiYrZg1f9cOfW867N/+fxh9QWDtO3x9as9XSQF+WftuVDGL8dnDFst+ZMJu37TJ
          C/R8kbvwbuDDaCq7LSs3es2Qlx0dbI5T6qFBWy8kd107JaVZh8127W6BCZNSN46x
          XNZmStd1k4IH08eufC8it+PoT2jD0TS80OTr1GCr9+7BcRJxeZvLayYwsROVsZd7
          wE9mEbRy1hmKSXHFEofBmCLhDdbmycg6tS3O6M3yUmhWQcm8/usJyk17ue2w1LOf
          Q00ATqM2VxKAlU4W0zjneUmuSJzO0RBPaFbaIba3pUqTD4hCizJjhExa3co3SdWZ
          CWEn0F0CAwEAATANBgkqhkiG9w0BAQsFAAOCAYEAkQ2pw1Y6yvzCR/Zt50Fj9Tuy
          Ord7K6iDIFkTK/rUwZoXm6BWcH9kQinwx9/NkQKB1sYuzK0bT6+hw5VYxiFAQlo2
          qVtCcTULJAq2dRLvSExgWbGsPSeHv8E5om1GRzh3cKtKNrtPlSD5oEVEEM/zVDXh
          CD2ugBWE0SYIG26cZONTRdqE12OMYLVLoZuCU4exs4GRaarfrvoFarPlCHzOJtWB
          Xi70xPr67TvFK7kQ0ARfYmWmoHoBdUBfqkZGpPFEZ/pCCNwhZqMCFX4HmPwJvK+K
          Qxkh6+uUybUdlgfCu6PaHaRma+d6Xx7fjWRUwnhE5ei0qsL7zIb5gdpgLMr3c1XE
          RJKfDwTNEYXrhE4J8du2ubF3vQTLBFZTOOfgs5f89oJ0vlPW52QYS1U+yv3I2Ngu
          f8jg7pVwPRr3G3K65zuQHcMT/PLi1mp7Xvpp9CuSsk79mRT6fUywVYSTOAYT/NHR
          y/WUnyaC9GM03YHrELIjWzn8muBsDYKWcINLuCR4
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in "$RUNNER_TEMP/artifact-recipient.pem" -noout -fingerprint -sha256 | grep -F '82:4A:0B:19:A1:E8:67:01:08:3B:C8:13:6E:58:8B:50:D5:84:CF:7A:7E:F1:4A:5B:E8:56:32:93:78:27:16:44'
          ipa=bazel-bin/Telegram/Telegram.ipa
          output="$RUNNER_TEMP/exteragram-0.0.5-iphone.ipa.cms"
          openssl cms -encrypt -aes256 -binary -outform DER -in "$ipa" -out "$output" "$RUNNER_TEMP/artifact-recipient.pem"
          test -s "$output"
          dossier=bazel-bin/Telegram/Telegram_dossier.zip
          dossier_output="$RUNNER_TEMP/exteragram-0.0.5-signing-dossier.zip.cms"
          test -s "$dossier"
          openssl cms -encrypt -aes256 -binary -outform DER -in "$dossier" -out "$dossier_output" "$RUNNER_TEMP/artifact-recipient.pem"
          test -s "$dossier_output"
          shasum -a 256 "$output" | awk '{print $1}' > "$RUNNER_TEMP/ipa-encrypted.sha256"
          echo 'Encrypted IPA ready; plaintext is not uploaded.'

      - name: Upload encrypted IPA and non-secret build report
        uses: actions/upload-artifact@v7
        with:
          name: exteraGram-iOS-Port-0.0.5-ARM64-private-test
          path: |
            ${{ runner.temp }}/exteragram-0.0.5-iphone.ipa.cms
            ${{ runner.temp }}/exteragram-0.0.5-signing-dossier.zip.cms
            ${{ runner.temp }}/ipa-report.json
            ${{ runner.temp }}/ipa-encrypted.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Match dSYM UUIDs to the IPA and encrypt debug symbols
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          symbols="$RUNNER_TEMP/exteragram-0.0.5-dsyms.zip"
          trap 'rm -f "$symbols"' EXIT
          python3 - "$symbols" <<'PY'
          import json, os, plistlib, re, subprocess, sys, zipfile
          from pathlib import Path

          def arm64_uuid(path):
              output = subprocess.check_output(['xcrun', 'dwarfdump', '--uuid', str(path)], text=True)
              match = re.search(r'UUID: ([0-9A-Fa-f-]+) \(arm64\)', output)
              return match.group(1).upper() if match else None

          temp = Path(os.environ['RUNNER_TEMP'])
          app, = (temp / 'device-audit' / 'Payload').glob('*.app')
          report = json.loads((temp / 'ipa-report.json').read_text())
          binary_uuids = {}
          for item in report['mach_o']:
              relative = item['path']
              uuid = arm64_uuid(app / relative)
              if uuid:
                  binary_uuids[relative] = uuid

          expected = set(binary_uuids.values())
          matches = {}
          for dsym in sorted(Path('bazel-bin').resolve().rglob('*.dSYM')):
              for dwarf in sorted((dsym / 'Contents' / 'Resources' / 'DWARF').glob('*')):
                  if not dwarf.is_file():
                      continue
                  uuid = arm64_uuid(dwarf)
                  if uuid in expected:
                      resolved = dwarf.resolve(strict=True)
                      matches.setdefault(uuid, (dsym, dwarf.name, resolved))

          with (app / 'Info.plist').open('rb') as f:
              main = plistlib.load(f)['CFBundleExecutable']
          core = 'Frameworks/TelegramCoreFramework.framework/TelegramCoreFramework'
          ui = 'Frameworks/TelegramUIFramework.framework/TelegramUIFramework'
          for binary in (main, core, ui):
              if binary_uuids.get(binary) not in matches:
                  sys.exit('Missing matching dSYM for ' + binary)

          archived_dwarfs = {}
          bundled = {path: uuid for path, uuid in binary_uuids.items() if uuid in matches}
          with zipfile.ZipFile(sys.argv[1], 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=3) as archive:
              for uuid, (dsym, name, dwarf) in sorted(matches.items()):
                  base = Path(uuid, dsym.name)
                  entry = base / 'Contents' / 'Resources' / 'DWARF' / name
                  archive.write(dwarf, entry)
                  archived_dwarfs[entry.as_posix()] = dwarf.stat().st_size
                  plist = dsym / 'Contents' / 'Info.plist'
                  archive.write(plist.resolve(strict=True), base / 'Contents' / 'Info.plist')
              archive.writestr('ipa-dsym-uuids.json', json.dumps(bundled, indent=2) + '\n')
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name, size in archived_dwarfs.items():
                  if not size or archive.getinfo(name).file_size != size:
                      sys.exit('The dSYM ZIP contains a missing or incomplete DWARF entry.')
              if archive.testzip() is not None:
                  sys.exit('The dSYM ZIP failed its integrity check.')
          print(f'Archived {len(archived_dwarfs)} real dSYM binaries, including TelegramUIFramework.')
          PY
          output="$symbols.cms"
          openssl cms -encrypt -aes256 -binary -outform DER -in "$symbols" -out "$output" "$RUNNER_TEMP/artifact-recipient.pem"
          test -s "$output"

      - name: Upload encrypted dSYMs for crash symbolication
        uses: actions/upload-artifact@v7
        with:
          name: exteraGram-iOS-Port-0.0.5-ARM64-symbols-encrypted
          path: ${{ runner.temp }}/exteragram-0.0.5-dsyms.zip.cms
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Final diagnostics and clean temporary credential inputs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/device-configuration.json" "$RUNNER_TEMP/device-build.py" "$GITHUB_WORKSPACE/build-input/configuration-repository/variables.bzl"
          rm -rf "$RUNNER_TEMP/device-audit"
          df -h "$GITHUB_WORKSPACE"
          vm_stat
